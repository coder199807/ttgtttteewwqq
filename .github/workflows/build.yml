name: Build IPTV M3U

on:
  schedule:
    # Every day at 01:00 UTC (04:00 TR)
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build.js"
      - ".github/workflows/build.yml"
      - "package.json"

concurrency:
  group: build-m3u
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate iptv.m3u (nightly fresh)
        if: github.event_name == 'schedule'
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
          CACHE_TTL_MS: "0"
        run: npm run build

      - name: Generate iptv.m3u (fast cached)
        if: github.event_name != 'schedule'
        env:
          PROXY_BASE: ${{ vars.PROXY_BASE }}
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv.m3u link_cache.json
          if [[ -n "$(git status --porcelain iptv.m3u link_cache.json)" ]]; then
            git commit -m "chore: update iptv.m3u + cache ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          else
            echo "No changes"
          fi
