name: Auto Clean M3U Playlist

on:
  schedule:
    # Führt das Skript täglich um 04:00 Uhr UTC aus
    - cron: '0 4 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Erlaubt das manuelle Starten über die GitHub-Oberfläche

jobs:
  clean-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Erlaubt das Überschreiben der Datei im Repository

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bereinigungs-Skript ausführen
        run: |
          python clean_playlist.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: M3U-Playlist bereinigt" && git push)
